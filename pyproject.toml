[project]
name = "startupflora-rag"
version = "2.0.0"
description = "Source-grounded StartupFlora chatbot using modular LangChain integrations"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
